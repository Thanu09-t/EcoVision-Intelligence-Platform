name: EcoVision AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-test:
    name: Backend CI (FastAPI & PyTest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio flake8 httpx
          if [ -f requirements-local.txt ]; then pip install -r requirements-local.txt; else pip install -r requirements.txt; fi

      - name: Lint with Flake8
        run: |
          cd backend
          # stop the build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Tests & Verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mock.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'mock-key' }}
          AI_MODE: mock
        run: |
          cd backend
          python verify_backend.py || true

  frontend-build:
    name: Frontend CI (Landing Page, Citizen App, Municipal Dashboard)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [landing-page, citizen-app, municipal-dashboard]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend/${{ matrix.app }}
          npm ci

      - name: Type Check & Lint
        run: |
          cd frontend/${{ matrix.app }}
          npm run lint || true

      - name: Build Application
        run: |
          cd frontend/${{ matrix.app }}
          npm run build

  docker-compose-check:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: |
          docker compose config
