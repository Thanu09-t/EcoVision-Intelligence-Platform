version: "3.9"

services:
  # ─── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: ecovision_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecovision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecovision123}
      POSTGRES_DB: ${POSTGRES_DB:-ecovision_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecovision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecovision_net

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecovision_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ecovision_net

  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecovision_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecovision}:${POSTGRES_PASSWORD:-ecovision123}@postgres:5432/${POSTGRES_DB:-ecovision_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-ecovision-dev-secret-key}
      AI_MODE: ${AI_MODE:-mock}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:80"]'
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecovision_net
    restart: unless-stopped

  # ─── Landing Page ───────────────────────────────────────────────────────────
  frontend-landing:
    build:
      context: ./frontend/landing-page
      dockerfile: Dockerfile
    container_name: ecovision_landing
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CITIZEN_URL: http://localhost:3001
      NEXT_PUBLIC_MUNICIPAL_URL: http://localhost:3002
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ecovision_net
    restart: unless-stopped

  # ─── Citizen App ────────────────────────────────────────────────────────────
  frontend-citizen:
    build:
      context: ./frontend/citizen-app
      dockerfile: Dockerfile
    container_name: ecovision_citizen
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - ecovision_net
    restart: unless-stopped

  # ─── Municipal Dashboard ────────────────────────────────────────────────────
  frontend-municipal:
    build:
      context: ./frontend/municipal-dashboard
      dockerfile: Dockerfile
    container_name: ecovision_municipal
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3002:3002"
    depends_on:
      - backend
    networks:
      - ecovision_net
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ecovision_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-landing
      - frontend-citizen
      - frontend-municipal
      - backend
    networks:
      - ecovision_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ecovision_net:
    driver: bridge
