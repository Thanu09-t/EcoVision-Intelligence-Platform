[project]
name = "ecovision-backend"
version = "1.0.0"
description = "EcoVision AI FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.25.2",
    "Pillow>=10.1.0",
    "numpy>=1.26.2",
    "reportlab>=4.0.8",
    "jinja2>=3.1.2",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.23",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
